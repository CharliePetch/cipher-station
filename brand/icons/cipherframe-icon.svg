    fill="none" stroke="#2dd4bf" stroke-width="34" />
  <circle cx="512" cy="512" r="130" fill="#2dd4bf" />
  <rect x="446" y="461" width="64" height="50" rx="12" fill="#0e1111" />
  <rect x="514" y="513" width="64" height="50" rx="12" fill="#0e1111" />
</svg>
