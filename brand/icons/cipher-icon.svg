<!--
  Vector source for cipher-icon-1024.png — the master app icon. Full-bleed
  square, no pre-rounded corners: iOS/macOS mask the shape themselves: any
  corner radius baked in here would double up or show as a hairline behind
  their mask. Flat fills only, no gradients or shadows, per DESIGN.md §2.
-->
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" fill="#0e1111" />
  <ellipse cx="512" cy="512" rx="340" ry="160" transform="rotate(-30 512 512)"
    fill="none" stroke="#2dd4bf" stroke-width="34" />
  <circle cx="512" cy="512" r="110" fill="#2dd4bf" />
</svg>
