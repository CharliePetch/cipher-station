    fill="none" stroke="#2dd4bf" stroke-width="34" />
  <circle cx="512" cy="512" r="130" fill="#2dd4bf" />
  <circle cx="512" cy="494" r="26" fill="#0e1111" />
  <polygon points="496,500 528,500 546,570 478,570" fill="#0e1111" />
</svg>
