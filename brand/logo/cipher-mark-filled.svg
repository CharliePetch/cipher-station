<!--
  Bold/filled variant of cipher-mark.svg. The UI mark's 2px stroke is tuned for
  24px inline use and disappears at small or distant sizes (favicons, app
  badges, print). This is the same mark at icon weight: a solid ring instead
  of a thin outline. Single colour, set via `fill`; swap `#2dd4bf` (dark-mode
  accent) for `#0f766e` (light-mode accent) depending on background.
-->
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <circle cx="16" cy="16" r="4.2" fill="#2dd4bf" />
  <ellipse cx="16" cy="16" rx="13" ry="6" transform="rotate(-30 16 16)"
    fill="none" stroke="#2dd4bf" stroke-width="2.4" />
</svg>
